<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>数据统计 - 脉图</title>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/my.css" />
  <style>
    /* 统计页面样式 */
    .stats-container {
      padding: 20px;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      margin-top: 20px;
    }
    
    .stats-header {
      font-size: 20px;
      font-weight: 600;
      color: #333;
      margin-bottom: 20px;
      padding-bottom: 10px;
      border-bottom: 2px solid #667eea;
    }
    
    .stats-section {
      margin-bottom: 30px;
    }
    
    .stats-section-title {
      font-size: 16px;
      font-weight: 500;
      color: #666;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .stats-card {
      background: #f9f9f9;
      border-radius: 6px;
      padding: 16px;
      margin-bottom: 12px;
      border-left: 4px solid #667eea;
    }
    
    .stats-card-header {
      font-size: 14px;
      font-weight: 500;
      color: #333;
      margin-bottom: 8px;
    }
    
    .stats-card-value {
      font-size: 24px;
      font-weight: 600;
      color: #667eea;
    }
    
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 20px;
    }
    
    .user-stats-list {
      max-height: 400px;
      overflow-y: auto;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
    }
    
    .user-stats-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      border-bottom: 1px solid #e0e0e0;
    }
    
    .user-stats-item:last-child {
      border-bottom: none;
    }
    
    .user-stats-item:hover {
      background: #f5f5f5;
    }
    
    .user-stats-name {
      font-size: 14px;
      color: #333;
    }
    
    .user-stats-count {
      font-size: 14px;
      font-weight: 500;
      color: #667eea;
    }
    
    /* 图表类型统计样式 */
    .chart-type-stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-bottom: 20px;
    }
    
    .chart-type-card {
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 12px;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      transition: all 0.3s ease;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    
    .chart-type-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 16px rgba(0,0,0,0.1);
    }
    
    .chart-type-icon {
      width: 50px;
      height: 50px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      color: #fff;
    }
    
    .chart-type-icon.relationship {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    
    .chart-type-icon.flow {
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
    }
    
    .chart-type-icon.mindmap {
      background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
    }
    
    .chart-type-info {
      flex: 1;
      text-align: center;
    }
    
    .chart-type-name {
      font-size: 16px;
      font-weight: 500;
      color: #333;
      margin-bottom: 4px;
    }
    
    .chart-type-count {
      font-size: 24px;
      font-weight: 600;
      color: #667eea;
    }
    
    .loading {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 200px;
      font-size: 14px;
      color: #666;
    }
    
    .empty {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 200px;
      font-size: 14px;
      color: #999;
    }
  </style>
</head>
<body>
  <div class="page">
    <!-- 左侧边栏 -->
    <div class="sidebar">
      <div class="logo">
        <img src="images/logo.png" alt="Logo">
        <div class="logo-text-container">
          <div class="logo-text-cn">脉图</div>
          <div class="logo-text-en">MindMaple</div>
        </div>
      </div>
      <button id="btnCreate" class="create-btn">+&nbsp;&nbsp;&nbsp;新建图表</button>
      <!-- 功能菜单 -->
      <div class="feature-menu">
        <div class="feature-item" onclick="window.location.href='/my.html'">
          <div class="feature-icon">🏠</div>
          <div class="feature-text">首页</div>
        </div>
        <div class="feature-item" onclick="window.location.href='/templates.html'">
          <div class="feature-icon">📋</div>
          <div class="feature-text">模版广场</div>
          <div class="feature-badge hot">HOT</div>
        </div>
        <div class="feature-item" onclick="showComingSoon()">
          <div class="feature-icon">👥</div>
          <div class="feature-text">协作</div>
        </div>
        <div class="feature-item admin-only" onclick="window.location.href='/stats.html'" style="background: #f0f0f0;">
          <div class="feature-icon">📊</div>
          <div class="feature-text">数据统计</div>
        </div>
      </div>
      <!-- 图表类型选择面板 -->
      <div id="chartTypePanel" class="chart-type-panel hidden">
        <div class="chart-type-section">
          <div class="chart-type-section-title">基础图表</div>
          <div class="chart-type-grid">
            <div class="chart-type-item" data-type="relationship">
              <div class="chart-type-icon">⚪</div>
              <div class="chart-type-name">关系图</div>
            </div>
            <div class="chart-type-item" data-type="flow">
              <div class="chart-type-icon">⬅</div>
              <div class="chart-type-name">流程图</div>
            </div>
            <div class="chart-type-item" data-type="mindmap">
              <div class="chart-type-icon">🌳</div>
              <div class="chart-type-name">思维导图</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 右侧内容区 -->
    <div class="main-content">
      <!-- 右侧顶部栏 -->
      <!-- <div class="header">
        <div class="header-left">
          <div class="search-box">
            <input type="text" class="search-input" id="searchInput" placeholder="搜索关系图..." />
            <div class="search-icon" id="searchIcon">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              </svg>
            </div>
          </div>
        </div>
        <div class="header-right">
          <div class="user-menu">
            <div class="user-info" id="userInfo">
              <span id="nickname" class="user-name">未登录</span>
              <img id="avatar" class="avatar" alt="" />
            </div>
          </div>
        </div>
      </div> -->

      <!-- 右侧内容区 -->
      <div class="content">
        <div class="stats-container">
          <div class="stats-header">数据统计</div>
          
          <!-- 概览统计 -->
          <div class="stats-section">
            <div class="stats-section-title">📊 统计概览</div>
            <div class="stats-grid">
              <div class="stats-card">
                <div class="stats-card-header">总用户数</div>
                <div class="stats-card-value" id="totalUsers">0</div>
              </div>
              <div class="stats-card">
                <div class="stats-card-header">总图表数</div>
                <div class="stats-card-value" id="totalGraphs">0</div>
              </div>
              <div class="stats-card">
                <div class="stats-card-header">平均图表数/用户</div>
                <div class="stats-card-value" id="avgGraphsPerUser">0</div>
              </div>
            </div>
          </div>
          
          <!-- 用户分析 -->
          <div class="stats-section">
            <div class="stats-section-title">👥 用户分析（前5名）</div>
            <div id="userStatsLoading" class="loading">加载中...</div>
            <div id="userStatsEmpty" class="empty" style="display: none;">暂无用户数据</div>
            <div id="userStatsList" class="user-stats-list" style="display: none;"></div>
          </div>
          
          <!-- 图表类型统计 -->
          <div class="stats-section">
            <div class="stats-section-title">📈 图表类型统计</div>
            <div id="chartTypeStatsLoading" class="loading">加载中...</div>
            <div id="chartTypeStatsEmpty" class="empty" style="display: none;">暂无图表数据</div>
            <div id="chartTypeStats" class="chart-type-stats" style="display: none;"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="/stats.js"></script>
</body>
</html>
